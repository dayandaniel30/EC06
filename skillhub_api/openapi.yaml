openapi: 3.0.3
info:
  title: SkillHub API
  version: 1.0.0
  description: Documentation des routes Formations (formateur connecté).

servers:
  - url: http://127.0.0.1:8000
    description: Local Laravel

tags:
  - name: Formations
    description: Gestion des formations du formateur connecté

paths:
  /api/formations:
    post:
      tags:
        - Formations
      summary: Créer une formation
      description: Crée une formation pour le formateur authentifié.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  maxLength: 255
                  example: React avancé
                description:
                  type: string
                  example: Approfondissement hooks, perf et architecture.
                price:
                  type: number
                  format: float
                  minimum: 0
                  example: 149.99
                duration:
                  type: integer
                  minimum: 1
                  example: 12
                level:
                  type: string
                  example: intermediate
            examples:
              createFormation:
                summary: Exemple payload création
                value:
                  title: React avancé
                  description: Approfondissement hooks, perf et architecture.
                  price: 149.99
                  duration: 12
                  level: intermediate
      responses:
        '201':
          description: Formation créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormationCreatedResponse'
              examples:
                success:
                  summary: Réponse succès
                  value:
                    message: Formation creee
                    data:
                      id: 42
                      title: React avancé
                      description: Approfondissement hooks, perf et architecture.
                      price: 149.99
                      duration: "12"
                      level: intermediate
                      user_id: 4
                      instructor_id: null
                      status: validated
                      created_at: "2026-03-06 10:00:00"
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Utilisateur non connecte
        '403':
          description: Rôle non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Action reservee aux formateurs/admins
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                message: Erreur de validation
                errors:
                  title:
                    - Le champ title est obligatoire.

  /api/my-formations:
    get:
      tags:
        - Formations
      summary: Lister les formations du formateur connecté
      description: >
        Retourne les formations du formateur authentifié.
        Filtres disponibles: `q`, `min_price`, `max_price`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Recherche texte (titre, description, niveau)
          example: react
        - in: query
          name: min_price
          required: false
          schema:
            type: number
            format: float
          description: Prix minimum
          example: 50
        - in: query
          name: max_price
          required: false
          schema:
            type: number
            format: float
          description: Prix maximum
          example: 200
      responses:
        '200':
          description: Liste récupérée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFormationsResponse'
              examples:
                success:
                  summary: Réponse succès
                  value:
                    message: Mes formations recuperees
                    data:
                      - id: 42
                        title: React avancé
                        description: Approfondissement hooks, perf et architecture.
                        price: 149.99
                        duration: "12"
                        level: intermediate
                        user_id: 4
                        instructor_id: null
                        status: validated
                        created_at: "2026-03-06 10:00:00"
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Utilisateur non connecte
        '403':
          description: Rôle non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Action reservee aux formateurs

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Formation:
      type: object
      properties:
        id:
          type: integer
          example: 42
        title:
          type: string
          example: React avancé
        description:
          type: string
          example: Approfondissement hooks, perf et architecture.
        price:
          type: number
          format: float
          example: 149.99
        duration:
          type: string
          example: "12"
        level:
          type: string
          example: intermediate
        user_id:
          type: integer
          example: 4
        instructor_id:
          nullable: true
          oneOf:
            - type: integer
            - type: string
          example: null
        status:
          type: string
          example: validated
        created_at:
          type: string
          example: "2026-03-06 10:00:00"

    FormationCreatedResponse:
      type: object
      properties:
        message:
          type: string
          example: Formation creee
        data:
          $ref: '#/components/schemas/Formation'

    MyFormationsResponse:
      type: object
      properties:
        message:
          type: string
          example: Mes formations recuperees
        data:
          type: array
          items:
            $ref: '#/components/schemas/Formation'

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
