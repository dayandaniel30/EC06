# Project identity: projectKey and organization are injected via CI env
# (vars.SONAR_PROJECT_KEY / vars.SONAR_ORG) to avoid hardcoding.
sonar.projectName=Skillhub (Laravel + Spring SSO)
sonar.sourceEncoding=UTF-8

# ---- Sources & tests (multi-language monorepo) ----
sonar.sources=\
  skillhub_api/app,\
  skillhub_api/config,\
  skillhub_api/routes,\
  skillhub_api/database,\
  Skillhub_springboot/src/main/java

sonar.tests=\
  skillhub_api/tests,\
  Skillhub_springboot/src/test/java

# ---- Exclusions ----
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/storage/**,\
  **/bootstrap/cache/**,\
  **/target/**,\
  **/.idea/**,\
  **/*.min.*

# ---- Language: PHP (Laravel) ----
sonar.php.coverage.reportPaths=skillhub_api/coverage.xml

# ---- Language: Java (Spring) ----
sonar.java.source=21
sonar.java.binaries=Skillhub_springboot/target/classes
sonar.coverage.jacoco.xmlReportPaths=Skillhub_springboot/target/site/jacoco/jacoco.xml
