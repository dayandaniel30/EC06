# =============================================================================
# SonarCloud - monorepo multi-langages (PHP + Java)
# =============================================================================
# Un seul projet Sonar couvre les deux microservices : le tableau de bord donne
# ainsi une vue unique de la qualite de la plateforme, et la Quality Gate
# s'applique a l'ensemble.
#
# `projectKey` et `organization` ne sont volontairement PAS ecrits ici : ils
# sont injectes par la CI depuis les variables GitHub (vars.SONAR_PROJECT_KEY,
# vars.SONAR_ORG), ce qui evite de figer l'identite du projet dans le depot.
# =============================================================================

sonar.projectName=Skillhub (Laravel + Spring SSO)
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8


# -----------------------------------------------------------------------------
# Sources analysees
# -----------------------------------------------------------------------------
sonar.sources=\
  skillhub_api/app,\
  skillhub_api/config,\
  skillhub_api/routes,\
  skillhub_api/database,\
  Skillhub_springboot/src/main/java

sonar.tests=\
  skillhub_api/tests,\
  Skillhub_springboot/src/test/java


# -----------------------------------------------------------------------------
# Exclusions
# -----------------------------------------------------------------------------
# Dependances tierces, artefacts de build et etat runtime : ni notre code, ni
# notre responsabilite. Les inclure fausserait tous les indicateurs.
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/storage/**,\
  **/bootstrap/cache/**,\
  **/target/**,\
  **/public/build/**,\
  **/.idea/**,\
  **/*.min.*

# Les migrations decrivent un schema, pas de la logique : leur imposer un seuil
# de couverture n'apporterait aucun signal utile.
sonar.coverage.exclusions=\
  skillhub_api/database/migrations/**,\
  skillhub_api/config/**,\
  skillhub_api/routes/**,\
  Skillhub_springboot/src/main/java/**/SaBackendApplication.java,\
  Skillhub_springboot/src/main/java/**/package-info.java


# -----------------------------------------------------------------------------
# PHP (Laravel)
# -----------------------------------------------------------------------------
# Rapports produits a l'etape 4 du pipeline puis transmis via artefact.
sonar.php.coverage.reportPaths=skillhub_api/coverage.xml
sonar.php.tests.reportPath=skillhub_api/phpunit.junit.xml


# -----------------------------------------------------------------------------
# Java (Spring Boot)
# -----------------------------------------------------------------------------
sonar.java.source=21
sonar.java.binaries=Skillhub_springboot/target/classes
sonar.java.test.binaries=Skillhub_springboot/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=Skillhub_springboot/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=Skillhub_springboot/target/surefire-reports
