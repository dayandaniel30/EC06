# =============================================================================
# Microservice SSO Skillhub - configuration Spring Boot
# =============================================================================
# Toutes les valeurs sensibles sont injectees par l'environnement (docker-compose
# en local, secrets d'orchestrateur en production). Les valeurs par defaut ne
# servent qu'au demarrage hors conteneur, en developpement.
# =============================================================================

spring:
  application:
    name: sa-backend

  # ---- Base de donnees dediee (pattern Database per Service) ----
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sso_db}
    username: ${SPRING_DATASOURCE_USERNAME:sso}
    password: ${SPRING_DATASOURCE_PASSWORD:sso}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: sso-pool
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      # `update` convient au TP et au developpement. En production, la migration
      # de schema devrait passer par Flyway ou Liquibase et cette valeur passer
      # a `validate`.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

server:
  port: ${SERVER_PORT:8080}
  error:
    # N'expose ni stacktrace ni message interne aux clients de l'API.
    include-stacktrace: never
    include-message: never

# ---- Sonde de sante consommee par le healthcheck Docker ----
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ---- Emission et verification des JWT ----
security:
  jwt:
    # Secret HMAC encode en Base64. JAMAIS de valeur de production ici :
    # elle est fournie par la variable d'environnement SA_JWT_SECRET.
    secret: ${SA_JWT_SECRET:Y2hhbmdlLW1lLXNraWxsaHViLXNzby1tYXN0ZXIta2V5LTIwMjYtMzJieXRlcy1taW4=}
    issuer: ${SA_JWT_ISSUER:skillhub-sso}
    audience: ${SA_JWT_AUDIENCE:skillhub-laravel}
    expiration-seconds: ${SA_JWT_EXPIRATION_SECONDS:3600}

  # ---- Compte de demonstration cree au premier demarrage ----
  seed:
    username: ${SA_SEED_USERNAME:apprenant@skillhub.test}
    password: ${SA_SEED_PASSWORD:Skillhub123!}
    role: ${SA_SEED_ROLE:APPRENANT}

logging:
  level:
    root: INFO
    mcci.auth.sa_backend: ${SA_LOG_LEVEL:INFO}
