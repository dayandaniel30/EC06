spring.application.name=sa-backend
server.port=8081

# ===== Datasource (PostgreSQL) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sso_users}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sso}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sso}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT / SSO =====
security.jwt.secret=${SA_JWT_SECRET:Y2hhbmdlLW1lLXNraWxsaHViLXNzby1tYXN0ZXIta2V5LTIwMjYtMzJieXRlcy1taW4=}
security.jwt.issuer=skillhub-sso
security.jwt.audience=skillhub-laravel
security.jwt.expiration-seconds=3600

# ===== Seed user =====
security.seed.username=apprenant@skillhub.test
security.seed.password=Skillhub123!
security.seed.role=APPRENANT
