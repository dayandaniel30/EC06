name: SonarCloud

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud (Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de PHP 8.2 avec pcov
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, fileinfo, sqlite, pdo_sqlite, zip, bcmath, intl
          coverage: pcov
          tools: composer:v2

      - name: Mise en cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: skillhub_api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('skillhub_api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Installation des dépendances Composer
        working-directory: skillhub_api
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Préparation de l'environnement de test
        working-directory: skillhub_api
        run: |
          cp .env.example .env 2>/dev/null || true
          [ -f .env ] || printf 'APP_NAME=Laravel\nAPP_ENV=testing\nAPP_DEBUG=true\nAPP_URL=http://localhost\nDB_CONNECTION=sqlite\nDB_DATABASE=:memory:\n' > .env
          php artisan key:generate --force

      - name: Exécution de PHPUnit avec couverture Clover
        working-directory: skillhub_api
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --log-junit=phpunit.junit.xml

      - name: Téléversement de l'artefact de couverture PHPUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: |
            skillhub_api/coverage.xml
            skillhub_api/phpunit.junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Analyse SonarCloud
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=skillhub_api/app,skillhub_api/config,skillhub_api/routes,skillhub_api/database
            -Dsonar.tests=skillhub_api/tests
            -Dsonar.php.coverage.reportPaths=skillhub_api/coverage.xml
            -Dsonar.exclusions=**/vendor/**,**/node_modules/**,**/storage/**,**/bootstrap/cache/**,**/*.min.*
